<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Voix d'Artisans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bande"></div>
    <h1>VOIX D'ARTISANS</h1>

  <main>
    <h2>Quel métier cherches-tu ?</h2>
    <div class="metiers">
      <button class="metier"><span>✂️</span>Couture</button>
      <button class="metier"><span>💇</span>Coiffure</button>
      <button class="metier"><span>🔧</span>Mécanique</button>
      <button class="metier"><span>🔨</span>Menuiserie</button>
      <button class="metier"><span>🧱</span>Maçonnerie</button>
      <button class="metier"><span>⚡</span>Électricité</button>
    </div>
  </main>

  <footer>
    <div class="bande"></div>
  <button class="micro" aria-label="Enregistrer ma voix" onclick="window.location='enregistrer.html'">🎤</button>
    <p>Je suis artisan : je présente mon travail</p>
  </footer>
</body>
  </html>
